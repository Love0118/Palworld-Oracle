name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - name: Validate scripts and settings editor
        run: PALWORLD_RUN_ROOT_TESTS=1 make check
